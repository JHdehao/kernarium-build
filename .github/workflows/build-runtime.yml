name: Build Kernarium iOS runtime

# 在 GitHub 的 macOS runner 上构建 Kernarium 的 iOS runtime 与 GPU 框架。
# 本机是 Linux，仓库的 GPU 依赖硬性要求 macOS 工具链（Meson 的
# appleframework 依赖、Metal Toolchain），只能借 macOS 机器跑一次。
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: 并行任务数
        required: false
        default: "4"

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: 取上游源码
        run: |
          git clone --depth 1 https://github.com/imxieyi/Kernarium.git src
          cd src
          # 上游在快速迭代：固定到已验证的提交，避免描述文件中途变化。
          git fetch --depth 1 origin b14aa9e6da9df15f467d8aad0090888373cc9b21
          git checkout -q FETCH_HEAD
          git config user.name "Kernarium CI"
          git config user.email "ci@kernarium.invalid"

      - name: 工具链信息
        run: |
          sw_vers
          xcodebuild -version
          df -h /
          sysctl -n hw.ncpu

      - name: 安装 Metal 工具链
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: 安装构建工具
        run: |
          brew install meson ninja bison flex pkgconf python@3.12 autoconf automake libtool gperf make gettext llvm lld
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix python@3.12)/libexec/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          LLD=""
          for d in "$(brew --prefix llvm)/bin" "$(brew --prefix lld)/bin" \
                   "$(brew --prefix)/bin"; do
            if [ -x "$d/ld.lld" ]; then LLD="$d/ld.lld"; break; fi
          done
          [ -n "$LLD" ] || { echo "找不到 ld.lld"; ls "$(brew --prefix llvm)/bin" | grep -i lld; exit 1; }
          echo "UML_KERNEL_LD=$LLD" >> "$GITHUB_ENV"
          echo "LLD=$LLD"
          PY="$(brew --prefix)/bin/python3.12"
          "$PY" -m pip install --user --break-system-packages mako packaging pyyaml
          "$PY" --version
          "$(brew --prefix)/bin/meson" --version
          "$(brew --prefix bison)/bin/bison" --version | head -1

      - name: 准备依赖源码
        working-directory: src
        run: |
          # build-apple-gpu.sh 的 env -i 只给 /usr/bin:/bin:/usr/sbin:/sbin，
          # macOS 自带 bison 2.3 解析不了 Mesa 的 GLSL 语法，换 Homebrew 的。
          sed -i '' \
            's|^APPLE_GPU_TOOL_PATH=/usr/bin:/bin:/usr/sbin:/sbin$|APPLE_GPU_TOOL_PATH=/opt/homebrew/opt/bison/bin:/opt/homebrew/opt/flex/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin|' \
            dependencies/build-apple-gpu.sh
          grep -n '^APPLE_GPU_TOOL_PATH=' dependencies/build-apple-gpu.sh
          # iOS SDK 的 <endian.h> 不提供 glibc 的 __BYTE_ORDER，Mesa 的
          # u_endian.h 会报「端序未定义」。交叉文件里显式声明小端。
          python3 -c "import pathlib;p=pathlib.Path('dependencies/build-apple-gpu.sh');s=p.read_text();s=s.replace(\"'-I\$STAGE/include']\", \"'-I\$STAGE/include', '-DUTIL_ARCH_LITTLE_ENDIAN=1', '-DUTIL_ARCH_BIG_ENDIAN=0']\");p.write_text(s)"
          grep -c 'UTIL_ARCH_LITTLE_ENDIAN' dependencies/build-apple-gpu.sh
          ./dependencies/prepare.sh --product apple-gpu-vulkan-experiment

      - name: 构建 GPU 依赖
        working-directory: src
        run: ./dependencies/build-apple-gpu.sh --platform ios --jobs "${{ inputs.jobs }}"

      - name: 构建网络/存储/压缩依赖
        working-directory: src
        run: |
          ./dependencies/prepare.sh --product ios-network
          ./dependencies/prepare.sh --product ios-storage
          ./dependencies/prepare.sh --product ios-compression
          ./dependencies/build-ios-network.sh --platform ios
          ./dependencies/build-ios-storage.sh
          ./dependencies/build-ios-zstd.sh

      - name: 内核宿主工具
        working-directory: src
        run: |
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if ./dependencies/prepare.sh --product kernel-host-tools; then ok=1; break; fi
            echo "第 $attempt 次准备失败，30 秒后重试"; sleep 30
          done
          [ "$ok" = 1 ] || { echo "宿主工具源码准备失败"; exit 1; }
          ./dependencies/prepare.sh --archive-manifest \
            dependencies/kernel-host-tools/archives.tsv
          ./dependencies/build-kernel-host-tools.sh

      - name: 内核源码与构建
        working-directory: src
        run: |
          # 内核树必须在大小写敏感文件系统上，macOS runner 默认不是。
          IMG="$RUNNER_TEMP/kern"
          MNT="$RUNNER_TEMP/kern-mnt"
          hdiutil create -size 40g -fs "Case-sensitive APFS" -type SPARSE \
            -volname kern "$IMG"
          hdiutil attach "$IMG.sparseimage" -mountpoint "$MNT"
          echo "UML_KERNEL_SOURCE_DIR=$MNT/linux" > \
            kernel/mainline-6.18/source-location.conf
          ./kernel/mainline-6.18/scripts/prepare-source.sh
          ./kernel/mainline-6.18/build/build-kernel.sh \
            --slice arm64 --build "$MNT/build-arm64" --jobs 4
          ./kernel/mainline-6.18/build/publish-artifact.py \
            --source "$MNT/linux" \
            --build "$MNT/build-arm64" \
            --slice arm64 \
            --output-root "$PWD/.build/kernel/artifacts" \
            --release-id 20261119-6.18.60-ca1 \
            --objcopy "$(xcrun --find llvm-objcopy)"
          # 本地重放的 commit 与作者发布的不同（树相同），把描述文件对齐到
          # 实际产物的 release 标识，CMake 才能导入。
          REL=$(grep -rhoE '6\.18\.[0-9]+-g[0-9a-f]{12}' \
            "$PWD/.build/kernel/artifacts" | head -1)
          echo "kernel release: $REL"
          [ -n "$REL" ] || { echo "没找到内核 release 标识"; exit 1; }
          sed -i '' "s|^UML_KERNEL_ARTIFACT_RELEASE=.*|UML_KERNEL_ARTIFACT_RELEASE='$REL'|" \
            kernel/mainline-6.18/artifacts/accepted-4k.env
          grep -n 'ARTIFACT_RELEASE=' kernel/mainline-6.18/artifacts/accepted-4k.env

      - name: 引导基础 initramfs
        working-directory: src
        run: |
          OUT="$RUNNER_TEMP/uml-boot-base-aarch64.cpio.gz"
          "$GITHUB_WORKSPACE/tools/make-boot-base.sh" "$OUT"
          DESC=tools/rootfs/boot-ramdisk/accepted-aarch64.env
          REL=$(grep '^UML_BOOT_BASE_RELEASE=' "$DESC" | cut -d"'" -f2)
          FILE=$(grep '^UML_BOOT_BASE_FILE=' "$DESC" | cut -d"'" -f2)
          echo "boot base: $REL/$FILE"
          mkdir -p ".build/rootfs/$REL"
          cp "$OUT" ".build/rootfs/$REL/$FILE"
          sed -i '' "s|^UML_BOOT_BASE_SIZE=.*|UML_BOOT_BASE_SIZE=$(wc -c < "$OUT" | tr -d ' ')|" "$DESC"
          sed -i '' "s|^UML_BOOT_BASE_SHA256=.*|UML_BOOT_BASE_SHA256='$(shasum -a 256 "$OUT" | awk '{print $1}')'|" "$DESC"
          cat "$DESC"

      - name: 配置 runtime
        working-directory: src
        run: cmake --preset kernarium-ios-device

      - name: 构建 runtime
        working-directory: src
        run: cmake --build --preset kernarium-ios-device

      - name: 打包框架
        working-directory: src
        run: Kernarium/scripts/package-ios-frameworks.sh --sdk device

      - name: 列出产物
        run: |
          find src/.build/kernarium-xcframeworks -maxdepth 2 -type d | head -20
          du -sh src/.build/kernarium-xcframeworks

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: kernarium-xcframeworks
          path: src/.build/kernarium-xcframeworks
          retention-days: 14
          compression-level: 1
